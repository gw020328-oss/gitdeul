<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>깃들 간단한 모형 미리보기</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e9dcc6;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#3d3a32}
canvas{position:absolute;left:0;top:0}
#lab{z-index:1;position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.l{position:absolute;transform:translate(-50%,0);text-align:center;font-size:11px;line-height:1.25;white-space:nowrap;text-shadow:0 0 4px #e9dcc6,0 0 4px #e9dcc6}
.l b{font-size:12px;display:block}
#bar{position:absolute;left:10px;top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;background:rgba(255,251,242,.8);padding:6px 10px;border-radius:10px;z-index:2}
#bar button{font:inherit;border:1px solid #b9ab8e;background:#f6efdf;border-radius:6px;padding:2px 8px;cursor:pointer}
#bar button.on{background:#7a9c7e;color:#fff;border-color:#7a9c7e}
#err{position:absolute;left:10px;bottom:8px;color:#a22;font:12px monospace;white-space:pre}
</style></head><body>
<div id="bar"></div><div id="lab"></div><div id="err"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="simple_models.js"></script>
<script src="preview.js"></script>
</body></html>
