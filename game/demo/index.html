<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>깃들 데모</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="tend pre">
<canvas id="c"></canvas>

<!-- 왼쪽 위: 구역, 날짜, 때, 돈 -->
<div class="card" id="top">
  <b id="ttl">겨울 들녘</b><span id="sub"></span>
  <i id="clk"><u id="clku"></u></i>
  <span id="coin"></span>
</div>

<!-- 오른쪽 위: 창을 여는 버튼과 오늘의 소식 -->
<div id="side">
  <div id="bar">
    <button class="card btn" id="bDex">도감 <kbd>B</kbd></button>
    <button class="card btn" id="bMap">지도 <kbd>T</kbd></button>
    <button class="card btn" id="bSet">설정</button>
  </div>
  <div class="card" id="news"></div>
  <div class="card" id="guest"></div>
</div>

<!-- 가운데 위: 화면을 가리지 않는 알림 -->
<div id="notes"></div>

<!-- 가꾸는 화면: AI 패널 -->
<div class="card tendonly" id="ai">
  <div class="hd"><b>AI의 판단</b><span class="tag temp" title="모델을 연결하기 전에 넣어 둔 규칙이에요">임시 규칙</span></div>
  <small id="aisays"></small>
  <div id="rows"></div>
  <div class="hd h2"><b>무엇을 바꾸면 달라질까</b></div>
  <p id="exp"></p>
  <em id="ainote"></em>
</div>

<!-- 가꾸는 화면: 칸, 돌봄, 벌이, 꾸밈 (상점과 가진 것) -->
<div class="card tendonly" id="pal">
  <div id="tabs"></div>
  <div id="chips"></div>
  <div id="palnote"></div>
</div>

<!-- 오른쪽 아래: 화면 바꾸기, 앉기, 잠자리 -->
<div id="main">
  <button class="card btn walkonly" id="bSit">앉아서 바라보기 <kbd>C</kbd></button>
  <button class="card btn" id="bMode"></button>
  <button class="card btn go" id="bSleep"></button>
</div>

<!-- 첫 아침 안내와 처음 마주칠 때의 한 줄 -->
<div class="card" id="tut"><span id="tutline"></span><button id="tutbtn"></button><button id="tutskip">건너뛰기</button></div>
<div class="card" id="obs"><span id="obst"></span><i><u id="obsb"></u></i></div>
<div class="card walkonly" id="tag"></div>
<div class="walkonly" id="cross"></div>
<div class="card" id="fps"></div>
<div class="card" id="dev"></div>

<div id="fade"></div>
<div id="modal"><div class="card"><h1 id="mh"></h1><div id="mb"></div><div id="mbtn"></div></div></div>

<div id="intro"><div class="card">
 <div id="introA">
  <h1>깃들</h1>
  <h2>사라져 가는 생명들이 깃드는 나만의 보호구역</h2>
  <p>땅을 가꾸면 이웃이 찾아와요. 들르고, 머물고, 마침내 깃들어요.</p>
  <small>데모예요. AI 자리에는 아직 임시 규칙이 들어 있고 숫자는 모두 임시예요. 하루는 7분쯤이에요. 저장은 이 브라우저에 저절로 돼요. 소리가 나요.</small>
  <div id="introbtn"></div>
  <small id="introsave"></small>
 </div>
 <div id="introB" style="display:none">
  <h1 style="font-size:22px">이름을 지어 주세요</h1>
  <p>비워 두고 넘어가도 돼요. 설정에서 언제든 고칠 수 있어요.</p>
  <p><label>지킴이 이름<br><input type="text" id="nmKeeper" maxlength="10" placeholder="지킴이"></label></p>
  <p><label>보호구역 이름<br><input type="text" id="nmPark" maxlength="14" placeholder="깃들 보호구역"></label></p>
  <small>보호구역 이름은 지도와 도감 표지에 보여요.</small>
  <div><button id="nmGo">첫 아침 맞으러 가기</button></div>
 </div>
</div></div>
<div id="err"></div>

<!--LIBS-->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/objects/Reflector.js"></script>
<!--/LIBS-->
<script>window.onerror = function (m, s, l) { var e = document.getElementById('err'); if (e) e.textContent += '오류: ' + m + ' (' + (s || '').split('/').pop() + ':' + l + ')\n'; };</script>
<!--GAME-->
<script src="models/crane_meshy_anim.js"></script>
<script src="models/stork_meshy.js"></script>
<script src="models/swan_meshy.js"></script>
<script src="../demo_models/simple_models.js"></script>
<script src="js/content_data.js"></script>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/data_base.js"></script>
<script src="js/content.js"></script>
<script src="js/visuals.js"></script>
<script src="js/state.js"></script>
<script src="js/rules.js"></script>
<script src="js/sim.js"></script>
<script src="js/world3d.js"></script>
<script src="js/objects3d.js"></script>
<script src="js/actors.js"></script>
<script src="js/audio.js"></script>
<script src="js/walk.js"></script>
<script src="js/tend.js"></script>
<script src="js/ui.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/main.js"></script>
<!--/GAME-->
</body>
</html>
